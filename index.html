<!DOCTYPE html>
<html>
<head>
    <title>Typing Speed Tester</title>
</head>
<body>
    <h1>Typing Speed Tester</h1>
    <p id="sentence"></p>
    <textarea id="input" placeholder="Start typing here..." rows="5" cols="50"></textarea>
    
    <p>Time: <span id="time">0</span> sec</p>
    <p>WPM <span id="wpm">0</span></p>
    <p>Accuracy: <span id="accuracy">0</span> %</p>

    <button onclick="restartTest()">Restart</button>

    <script>
        const sentences = [
            "Typing is a fundamental skill that improves with deliberate practice and consistency over time. When you focus on accuracy first, your speed naturally increases as your muscle memory develops. Many beginners rush through words, but true improvement comes from maintaining steady rhythm and minimizing errors. By practicing regularly and challenging yourself with longer passages, you can significantly enhance both your typing speed and confidence.",

            "Technology has transformed the way we communicate, learn, and work in the modern world. From smartphones to cloud computing, digital tools have become an essential part of everyday life. Learning how to efficiently use these tools, including typing quickly and accurately, can give you a strong advantage in academics and professional environments. As technology continues to evolve, adaptability and continuous learning remain the most valuable skills anyone can develop.",

            "Success in any field requires discipline, patience, and the willingness to learn from mistakes. Whether you are coding, studying, or building new habits, progress is rarely immediate. It is the result of consistent effort applied over time. Many people give up too early because they expect quick results, but those who stay committed eventually achieve meaningful growth. Developing a strong mindset is just as important as developing technical skills.",

            "Web development is one of the most exciting and accessible fields in the world of technology today. With just a basic understanding of HTML, CSS, and JavaScript, you can create interactive and functional websites. As you continue learning, you can explore advanced concepts such as frameworks, APIs, and backend systems. However, mastering the fundamentals is the most important step, as it builds the foundation for everything else you will learn.",

            "Practicing typing with longer paragraphs helps improve focus, endurance, and consistency. Short sentences may help beginners get started, but longer passages simulate real-world typing scenarios such as writing essays, emails, or reports. By gradually increasing the difficulty and length of the text, you train your brain and fingers to work together more efficiently. Over time, this leads to faster typing speeds and fewer mistakes.",

            "Building good habits is one of the most powerful ways to improve your life. Small actions repeated daily can lead to significant long-term results. Whether it is studying regularly, exercising, or practicing a skill like typing, consistency is the key factor that determines success. Motivation may come and go, but discipline ensures that you keep moving forward even when you do not feel like it.",

            "Learning to code is not just about writing lines of code, but about solving problems and thinking logically. Every project you build teaches you something new, whether it is debugging errors, structuring your code, or improving user experience. Beginners often feel overwhelmed at first, but with practice and persistence, complex concepts become easier to understand. The journey may be challenging, but it is also highly rewarding.",

            "Time management is an essential skill that can greatly impact your productivity and success. By organizing your tasks and prioritizing what matters most, you can make better use of your time and reduce stress. Many people struggle because they try to do too much at once without a clear plan. Developing a structured approach to your day allows you to work more efficiently and achieve your goals more effectively.",

            "Improving your typing speed is not about rushing through the keyboard, but about developing accuracy, rhythm, and confidence. When you type correctly without constantly looking at the keyboard, your speed naturally improves. Practicing regularly with meaningful content helps reinforce this skill. Over time, typing becomes effortless, allowing you to focus more on your thoughts rather than the act of typing itself.",

            "Consistency is the bridge between goals and achievement. No matter how ambitious your goals are, they can only be reached through continuous effort and dedication. Many people start strong but lose momentum along the way. The key is to keep going even when progress seems slow. Every small step contributes to the bigger picture, and over time, those small steps lead to significant accomplishments."
        ];

        let startTime = null;
        let timer = null;
        let time = 0;
        
        const sentenceEl = document.getElementById("sentence");
        const inputEl = document.getElementById("input");

        function loadSentence() {
            const random = Math.floor(Math.random() * sentences.length);
            sentenceEl.textContent = sentences[random];
        }

        function startTimer() {
            startTime = new Date();
            timer = setInterval(() => {
                const currentTime = Math.floor((new Date() - startTime) / 1000);
                document.getElementById("time").textContent = currentTime;
            }, 1000);
        }

        inputEl.addEventListener("input", () => {
            if (timer === null) {
                startTimer();
            }

            const inputText = inputEl.value;
            const originalText = sentenceEl.textContent;
            const currentTime = Math.floor((new Date() - startTime) / 1000);
            time = currentTime > 0 ? currentTime : 1;
            document.getElementById("time").textContent = currentTime;
            const words = inputText.trim() === "" ? 0 : inputText.trim().split(/\s+/).length;
            const wpm = Math.round((words / time) * 60);
            document.getElementById("wpm").textContent = wpm;

            let correct = 0;
            for (let i = 0; i < inputText.length; i++) {
                if (inputText[i] === originalText[i]) {
                    correct++;
                }
            }
            const accuracy = inputText.length > 0
                ? Math.round((correct / inputText.length) * 100)
                : 0;
            document.getElementById("accuracy").textContent = accuracy;

            if (inputText.trim() === originalText.trim()) {
                clearInterval(timer);
                timer = null;
                alert("Test Completed!");
            }
        });

        function restartTest() {
            clearInterval(timer);
            timer = null;
            startTime = null;
            time = 0;

            inputEl.value = "";
            document.getElementById("time").textContent = 0;
            document.getElementById("wpm").textContent = 0;
            document.getElementById("accuracy").textContent = 0;

            loadSentence();
        }

        loadSentence();
    </script>
</body>
</html>
